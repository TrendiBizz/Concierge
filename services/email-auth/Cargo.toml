[package]
name = "email-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory"] }
