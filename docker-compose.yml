name: concierge

# Core services (always on): caddy, postgres, redis, api
# Optional services are enabled with profiles, e.g. in .env:
#   COMPOSE_PROFILES=support,crm,ops
#
#   support    -> chatwoot     (human inbox / live handoff)
#   crm        -> twenty       (CRM, contacts, pipelines)
#   ops        -> uptime-kuma  (uptime monitoring)

x-restart: &restart
  restart: unless-stopped

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?run scripts/gen-env.sh}
  FRONTEND_URL: https://chat.${DOMAIN:-localhost}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: chatwoot
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh}
  REDIS_URL: redis://redis:6379/1
  ENABLE_ACCOUNT_SIGNUP: "false"
  FORCE_SSL: "false"
  LOG_LEVEL: info
  RAILS_LOG_TO_STDOUT: "true"

x-twenty-env: &twenty-env
  NODE_PORT: "3000"
  PG_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?run scripts/gen-env.sh}@postgres:5432/twenty
  SERVER_URL: https://crm.${DOMAIN:-localhost}
  REDIS_URL: redis://redis:6379/2
  APP_SECRET: ${TWENTY_APP_SECRET:?run scripts/gen-env.sh}
  STORAGE_TYPE: local

services:
  # ---------------------------------------------------------------- core
  caddy:
    image: caddy:2
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    <<: *restart
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run scripts/gen-env.sh}@postgres:5432/concierge
      ADMIN_TOKEN: ${ADMIN_TOKEN:?run scripts/gen-env.sh}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.localhost}
      # Social integration is explicitly opt-in. API and Rust sidecar share the
      # API container's loopback network namespace; no public social port.
      SOCIAL_SERVICE_ENABLED: ${SOCIAL_SERVICE_ENABLED:-false}
      SOCIAL_SERVICE_URL: http://127.0.0.1:4390
      SOCIAL_CONCIERGE_KEY: ${SOCIAL_CONCIERGE_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.x.ai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-grok-4}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_DEFAULT: ${VOICE_DEFAULT:-eve}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # SMS provider switch, campaigns and response alerts. Every default matches app/config.py, so an
      # unchanged .env behaves exactly as before.
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SMSGATE_BASE_URL: ${SMSGATE_BASE_URL:-}
      SMSGATE_SEND_PATH: ${SMSGATE_SEND_PATH:-/3rdparty/v1/messages}
      SMSGATE_USERNAME: ${SMSGATE_USERNAME:-}
      SMSGATE_PASSWORD: ${SMSGATE_PASSWORD:-}
      SMSGATE_SIGNING_KEY: ${SMSGATE_SIGNING_KEY:-}
      SMSGATE_SIM_NUMBER: ${SMSGATE_SIM_NUMBER:-0}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      CAMPAIGN_MAX_RECIPIENTS: ${CAMPAIGN_MAX_RECIPIENTS:-200}
      CAMPAIGN_COOLDOWN_DAYS: ${CAMPAIGN_COOLDOWN_DAYS:-30}
      CAMPAIGN_EMAIL_PER_HOUR: ${CAMPAIGN_EMAIL_PER_HOUR:-60}
      CAMPAIGN_SMS_PER_HOUR: ${CAMPAIGN_SMS_PER_HOUR:-20}
      SLA_POLL_SECONDS: ${SLA_POLL_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach LM Studio running on the host machine
    ports:
      # Direct access for local development / the CLI. Caddy serves the public hostname.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Social OAuth backend (optional): shares the API's loopback namespace.
  # Configure the git-ignored social.env and matching SOCIAL_CONCIERGE_KEY
  # in the Compose environment before enabling this profile.
  social:
    build: ./concierge-stack/social-service
    <<: *restart
    profiles: ["social"]
    network_mode: "service:api"
    env_file:
      - path: ./concierge-stack/social-service/data/social.env
        required: false
    environment:
      SOCIAL_DB: /data/social.db
      SOCIAL_BIND: 127.0.0.1:4390
      SOCIAL_ENABLE_PUBLISH: "false"
    volumes:
      - social_data:/data
    depends_on:
      - api

  # ------------------------------------------------------------- support
  chatwoot-prepare:
    image: chatwoot/chatwoot:${CHATWOOT_TAG:-latest}
    profiles: ["support"]
    restart: "no"
    environment: *chatwoot-env
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_TAG:-latest}
    <<: *restart
    profiles: ["support"]
    environment: *chatwoot-env
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_TAG:-latest}
    <<: *restart
    profiles: ["support"]
    environment: *chatwoot-env
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully

  # ----------------------------------------------------------------- crm
  twenty:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    <<: *restart
    profiles: ["crm"]
    environment: *twenty-env
    volumes:
      - twenty_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  twenty-worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    <<: *restart
    profiles: ["crm"]
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      - twenty

  # ----------------------------------------------------------------- ops
  uptime-kuma:
    image: louislam/uptime-kuma:1
    <<: *restart
    profiles: ["ops"]
    volumes:
      - kuma_data:/app/data

volumes:
  social_data:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  chatwoot_storage:
  twenty_storage:
  kuma_data:
