name: ${COMPOSE_PROJECT_NAME:-concierge-vm}

# Concierge VM test bundle: Twenty CRM + lead bridge + the 24-page site.
# Start with ./run.sh (see README.md). Secrets come from .env (created by run.sh,
# never committed) and from the TWENTY_API_KEY environment variable.
#
# Ports are published on all interfaces so a browser outside the VM can reach them.
# The site expects the CRM on :3010 and the bridge on :4410 of the same host name,
# so keep those two defaults unless you also set window.CONCIERGE_APP_URL.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run ./run.sh first}
      POSTGRES_DB: default
    volumes:
      - twenty_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.56.0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${TWENTY_PORT:-3010}:3000"
    environment:
      NODE_PORT: "3000"
      SERVER_URL: ${TWENTY_PUBLIC_URL:-http://localhost:3010}
      PG_DATABASE_URL: postgres://postgres:${PG_PASSWORD:?run ./run.sh first}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?run ./run.sh first}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
    volumes:
      - twenty_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.56.0}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      SERVER_URL: ${TWENTY_PUBLIC_URL:-http://localhost:3010}
      PG_DATABASE_URL: postgres://postgres:${PG_PASSWORD:?run ./run.sh first}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?run ./run.sh first}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy

  # Lead bridge: the repo's own code, mounted read-only. No key is baked in.
  # Until TWENTY_API_KEY is set the bridge answers 503 not_configured and the
  # site's contact form falls back to email.
  bridge:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BRIDGE_PORT:-4410}:4410"
    environment:
      HOST: 0.0.0.0
      PORT: "4410"
      TWENTY_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - ../integrations/twenty/bridge:/app:ro
    depends_on:
      server:
        condition: service_healthy

  # The 24-page website, static, from ./site (unzipped by run.sh).
  site:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${SITE_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

volumes:
  twenty_db:
  twenty_storage:
