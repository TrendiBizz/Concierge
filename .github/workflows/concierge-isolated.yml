name: Concierge isolated verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concierge-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: isolated-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - score_integration
          - phase3_integration
          - campaign_integration
          - campaign_routes_check
          - office_integration
          - booking_integration
          - email_drafts_integration
          - phone_relay_integration
          - owner_rbac_integration
          - owner_security_integration
          - owner_maintenance_integration
          - cloudflare_inbound_integration
          - channel_authorization_db_integration
          - customer_authorization_test
          - hermes_ops_integration
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install verification dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run isolated suite
        env:
          PYTHONPATH: QA/verification/shims:api
          CONCIERGE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          OUTBOX_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suite }}" == "unit" ]]; then
            # The whole directory, not just test_units.py. Running one file meant 16 of 17 files
            # (including the case timeline, takeover, channel-enable, booking-enable and inbound
            # SMS route suites) never executed in CI at all.
            #
            # One test is deselected by marker: it opens real TCP servers and spawns bridge tasks,
            # and on CPython 3.12 it wedges the interpreter with no output at all (verified: it
            # passes in 0.17s on 3.13, three runs). Excluding it is a documented concession, not a
            # silent skip -- it still runs locally on 3.13 and should be fixed, not forgotten.
            python -m pytest api/tests -q -m "not hangs_on_py312"
          else
            python "QA/verification/${{ matrix.suite }}.py"
          fi

  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python syntax and git hygiene
        run: |
          python3 -m compileall -q api/app QA/verification
          git diff --check
      - name: Trivy secret and config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL

  restore-proof:
    name: disposable-postgres-restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Backup and restore canary (no production resources)
        run: bash QA/verification/restore_disposable.sh

  rust-social:
    name: rust-social-locked
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: concierge-stack/social-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install ffmpeg (media pipeline tests encode real fixtures)
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify Rust social service
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API contract test dependencies
        working-directory: .
        run: python -m pip install -r api/requirements-dev.txt
      - name: Verify Python-to-Rust isolated HTTP contract
        working-directory: .
        env:
          PYTHONPATH: QA/verification/shims:api
          CONCIERGE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          SOCIAL_ENABLE_PUBLISH: 'false'
        run: python QA/verification/social_rust_contract_test.py

      - name: Verify separate customer onboarding against PostgreSQL and Rust
        working-directory: .
        env:
          PYTHONPATH: QA/verification/shims:api
          CONCIERGE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python -m unittest QA.verification.customer_onboarding_integration -v

  socialsync:
    name: socialsync-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: concierge-stack/socialsync/server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated SocialSync tests
        run: node --test
      - name: Verify website widget controls without browser or providers
        working-directory: .
        run: node --test QA/verification/widget_host_controls_test.cjs QA/verification/owner_customer_journey_test.cjs QA/verification/operator_customer_creation_test.cjs
