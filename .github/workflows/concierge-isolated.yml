name: Concierge isolated verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concierge-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: isolated-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - score_integration
          - phase3_integration
          - campaign_integration
          - campaign_routes_check
          - office_integration
          - email_drafts_integration
          - phone_relay_integration
          - owner_rbac_integration
          - owner_security_integration
          - cloudflare_inbound_integration
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install verification dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run isolated suite
        env:
          PYTHONPATH: QA/verification/shims:api
          OUTBOX_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suite }}" == "unit" ]]; then
            python -m pytest api/tests/test_units.py -q
          else
            python "QA/verification/${{ matrix.suite }}.py"
          fi

  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python syntax and git hygiene
        run: |
          python3 -m compileall -q api/app QA/verification
          git diff --check
      - name: Trivy secret and config scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL

  restore-proof:
    name: disposable-postgres-restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Backup and restore canary (no production resources)
        run: bash QA/verification/restore_disposable.sh
