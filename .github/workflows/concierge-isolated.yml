name: Concierge isolated verification

on:
  # Run on pushes to main too. It previously ran only on pull_request, so three stale
  # tests sat red on main unnoticed (2026-11-12 system check).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concierge-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: isolated-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - score_integration
          - phase3_integration
          - campaign_integration
          - campaign_routes_check
          - office_integration
          - booking_integration
          - email_drafts_integration
          - phone_relay_integration
          - owner_rbac_integration
          - owner_security_integration
          - owner_maintenance_integration
          - cloudflare_inbound_integration
          - channel_authorization_db_integration
          - customer_authorization_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install verification dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run isolated suite
        env:
          PYTHONPATH: QA/verification/shims:api
          CONCIERGE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          OUTBOX_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suite }}" == "unit" ]]; then
            # The whole directory, not just test_units.py. Running one file meant 16 of 17 files
            # (including the case timeline, takeover, channel-enable, booking-enable and inbound
            # SMS route suites) never executed in CI at all.
            #
            # One test is deselected by marker: it opens real TCP servers and spawns bridge tasks,
            # and on CPython 3.12 it wedges the interpreter with no output at all (verified: it
            # passes in 0.17s on 3.13, three runs). Excluding it is a documented concession, not a
            # silent skip -- it still runs locally on 3.13 and should be fixed, not forgotten.
            TEST_DATABASE_URL="postgresql://postgres:test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres" \
              python -m pytest api/tests -q -m "not hangs_on_py312"
          else
            # *_integration.py scripts live in api/tests (not collected by pytest: no test_ prefix);
            # the remaining *_check / *_test scripts are still in QA/verification.
            if [[ -f "api/tests/${{ matrix.suite }}.py" ]]; then
              python "api/tests/${{ matrix.suite }}.py"
            else
              python "QA/verification/${{ matrix.suite }}.py"
            fi
          fi

  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python syntax, SEO contract and git hygiene
        run: |
          python3 -m compileall -q api/app QA/verification scripts/vps scripts/seo
          python3 scripts/seo/site_seo.py check
          git diff --check
      - name: Trivy secret and config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL

  restore-proof:
    name: disposable-postgres-restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Backup and restore canary (no production resources)
        run: bash QA/verification/restore_disposable.sh

  unified-social:
    name: unified-social-module
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Verify unified Concierge social & Meta messaging module
        working-directory: api
        env:
          PYTHONPATH: ../QA/verification/shims:.
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        run: pytest -q tests/test_unified_social.py tests/test_h7_social_publishing.py tests/test_n7_meta_inbound.py tests/test_local_config.py tests/test_provider_readiness.py

  concierge-node:
    name: concierge-node-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website widget controls without browser or providers
        run: node --test QA/verification/widget_host_controls_test.cjs QA/verification/owner_customer_journey_test.cjs QA/verification/operator_customer_creation_test.cjs
