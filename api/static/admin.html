<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Concierge admin</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e5e8;--ink:#111;--mute:#666;--acc:#2563eb;--hot:#b42318;--warm:#b54708;--cold:#475467;--ok:#027a48}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:#111827;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 12px 0 0}
  select,input,button,textarea{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
  button{background:var(--acc);color:#fff;border:0;cursor:pointer}
  button.sec{background:#e5e7eb;color:#111}
  button.danger{background:var(--hot)}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{max-width:1180px;margin:16px auto;padding:0 16px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:#e5e7eb;color:#111}.tabs button.on{background:var(--acc);color:#fff}
  .tabs .count{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--hot);color:#fff;font-size:12px;line-height:18px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:12px}
  table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid #eee;vertical-align:top}
  code,pre{background:#f1f5f9;border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all}
  pre{padding:8px;white-space:pre-wrap}
  .mut{color:var(--mute)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bubble{padding:6px 10px;border-radius:10px;margin:3px 0;max-width:80%}
  .user{background:#dbeafe;margin-left:auto}.assistant{background:#f1f5f9}.flag{outline:2px solid #f59e0b}
  #login{max-width:360px;margin:80px auto}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
  .badge.hot{background:var(--hot)}.badge.warm{background:var(--warm)}.badge.cold{background:var(--cold)}
  .badge.ok{background:var(--ok)}
  .notice{border-left:4px solid var(--warm);background:#fffaeb;padding:8px 12px;border-radius:6px;margin:8px 0}
  .notice.bad{border-color:var(--hot);background:#fef3f2}
  .notice.good{border-color:var(--ok);background:#ecfdf3}
  .field{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .field label{width:170px}
  .small{font-size:12px}
  h2{font-size:15px;margin:0 0 8px}
  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;align-items:start}
  .col{background:#eceff3;border-radius:10px;padding:10px}
  .col h3{margin:0 0 2px;font-size:14px;text-transform:capitalize}
  .deal{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
  .deal .name{font-weight:600;margin-right:6px}
  .deal label{display:block;font-size:11px;color:var(--mute);margin-top:6px}
  .deal input,.deal select{width:100%;padding:4px 6px;font-size:13px}
  .overdue{color:var(--hot);font-weight:600}
  .todo-done td{opacity:.55;text-decoration:line-through}
  .src{font-size:11px;padding:1px 7px;border-radius:999px;background:#e5e7eb;color:#333}
</style>
</head>
<body>
<div id="login" class="card">
  <h2 style="margin-top:0">Concierge admin</h2>
  <p class="mut">Enter your ADMIN_TOKEN. It is kept only in this tab's session storage.</p>
  <div class="row"><input id="token" type="password" placeholder="Admin token" style="flex:1"><button id="go">Sign in</button></div>
  <p id="loginErr" class="mut"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Concierge</h1>
    <select id="tenant"></select>
    <select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
    <button class="sec" id="new-customer">Add customer</button>
    <button class="sec" id="refresh">Refresh</button>
    <button class="sec" id="logout">Sign out</button>
  </header>
  <main>
    <section class="card" id="new-customer-panel" hidden><h2>Add a customer</h2><p>Create a separate business workspace and a private invitation for its owner. No messages are sent automatically and no channel is activated.</p>
    <form id="new-customer-form"><div class="field"><label for="new-customer-name">Business name</label><input id="new-customer-name" required maxlength="160" autocomplete="organization"></div>
    <div class="field"><label for="new-customer-email">Owner email</label><input id="new-customer-email" type="email" required maxlength="320" autocomplete="email"></div>
    <div class="field"><label for="new-customer-site">Website (optional)</label><input id="new-customer-site" type="url" maxlength="2048" placeholder="https://example.com"></div>
    <button id="create-customer" type="submit">Create workspace and invitation</button></form>
    <p id="new-customer-status" role="status" aria-live="polite"></p><div id="new-customer-result"></div></section>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var token = "", tenants = [], current = null, tab = "overview", waitingCount = 0;
  var campaignPreview = null;   // the preview currently shown on the Campaigns tab
  var leadFilter = { minScore: "0", sortScore: false };
  var todoFilter = { done: false };
  var emailFeature = false;
  var overdueTodos = 0;
  var pendingCustomer = null, customerSaving = false;
  var flash = "";               // a confirmation that must survive the re-render that follows a save
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") n.textContent = props[k];
      else if (k === "class") n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }

  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(path, {
      method: opts.method || "GET",
      headers: { "X-Admin-Token": token, "Content-Type": "application/json" },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (res.status === 401) throw new Error("auth");
    if (!res.ok) {
      var text = await res.text(), msg = text;
      try { var j = JSON.parse(text); msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {}
      throw new Error(msg.slice(0, 300));
    }
    return res.json();
  }

  function money(c) { return c ? "$" + (c / 100).toLocaleString() : "-"; }
  function when(s) { return s ? new Date(s).toLocaleString() : ""; }
  function waited(min) { return min < 60 ? min + " min" : Math.floor(min / 60) + " h " + (min % 60) + " min"; }
  function table(head, rows) {
    var t = el("table");
    t.appendChild(el("tr", {}, head.map(function (h) { return el("th", { text: h }); })));
    rows.forEach(function (r) { t.appendChild(el("tr", {}, r.map(function (c) { return el("td", {}, [c instanceof Node ? c : String(c == null ? "" : c)]); }))); });
    return t;
  }
  function select(options, value, onChange) {
    var s = el("select");
    options.forEach(function (o) { var op = el("option", { value: o, text: o }); if (o === value) op.selected = true; s.appendChild(op); });
    s.addEventListener("change", function () { onChange(s.value); });
    return s;
  }
  function card(title, child) { return el("div", { class: "card" }, [title ? el("b", { text: title }) : "", child]); }
  function badge(label, score, reasons) {
    var b = el("span", { class: "badge " + (label || "cold"), text: (label || "cold") + (score != null ? " " + score : "") });
    if (reasons && reasons.length) b.setAttribute("title", reasons.join("\n"));
    return b;
  }
  function reasonsOf(l) {
    var r = l.score_reasons;
    if (typeof r === "string") { try { r = JSON.parse(r); } catch (e) { r = []; } }
    return Array.isArray(r) ? r : [];
  }
  function notice(kind, text) { return el("div", { class: "notice " + kind, text: text }); }
  function fail(e) { if (e.message === "auth") return logout(); alert(e.message); }
  function moveLead(id, status) {
    var body = { status: status };
    if (status === "lost") {
      var why = prompt("Why was this lead lost? (optional)");
      if (why === null) return Promise.resolve(false);
      body.lost_reason = why.trim();
    }
    return api("/admin/leads/" + id, { method: "PATCH", body: body }).then(function () { return true; });
  }
  function localInputValue(iso) {
    if (!iso) return "";
    var d = new Date(iso), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var TABS = ["overview", "attention", "pipeline", "leads", "to-dos", "campaigns", "appointments", "conversations", "outbox", "setup"];

  function renderTabs() {
    var box = $("tabs"); box.textContent = "";
    TABS.forEach(function (t) {
      var b = el("button", { text: t === "attention" ? "needs attention" : t, class: t === tab ? "on" : "" });
      if (t === "attention" && waitingCount > 0) b.appendChild(el("span", { class: "count", text: String(waitingCount) }));
      if (t === "to-dos" && overdueTodos > 0) b.appendChild(el("span", { class: "count", text: String(overdueTodos) }));
      b.addEventListener("click", function () { tab = t; renderTabs(); render(); });
      box.appendChild(b);
    });
  }

  async function refreshWaiting() {
    if (!current) { waitingCount = 0; return; }
    try { waitingCount = (await api("/admin/tenants/" + current.slug + "/sla")).waiting.length; } catch (e) { waitingCount = 0; }
    try {
      var open = await api("/admin/tenants/" + current.slug + "/tasks");
      overdueTodos = open.filter(function (x) { return x.due_at && new Date(x.due_at) < new Date(); }).length;
    } catch (e) { overdueTodos = 0; }
    renderTabs();
  }

  // ---------------------------------------------------------------- views
  async function viewOverview(v, slug, days) {
    var s = await api("/admin/tenants/" + slug + "/stats?days=" + days);
    var sla = await api("/admin/tenants/" + slug + "/sla");
    var sm = await api("/admin/tenants/" + slug + "/sales-summary?days=" + days);
    var stat = function (l, val) { return el("div", { class: "card stat" }, [el("b", { text: String(val) }), el("span", { text: l })]); };
    v.appendChild(el("div", { class: "grid" }, [
      stat("Conversations", s.conversations), stat("Leads", s.leads), stat("Appointments", s.appointments),
      stat("Lead rate", (s.lead_rate * 100).toFixed(1) + "%"), stat("Est. pipeline", money(s.estimated_pipeline_cents)),
      stat("Won value", money(s.won_value_cents)), stat("Quote-guard saves", s.quote_guard_interventions),
      stat("Leads waiting for a reply", sla.sla_minutes ? sla.waiting.length : "off"),
      stat("Won in this period", sm.won + " (" + money(sm.won_value_cents) + ")"),
      stat("Open pipeline", money(sm.open_value_cents)), stat("Weighted pipeline", money(sm.weighted_value_cents)),
      stat("Overdue to-dos", sm.overdue_todos)
    ]));
    if (!sla.sla_minutes) {
      v.appendChild(notice("", "Response alerts are off. Turn them on under Setup to be told when a hot lead is left waiting."));
    } else if (sla.waiting.length) {
      var go = el("button", { text: "See them" });
      go.addEventListener("click", function () { tab = "attention"; renderTabs(); render(); });
      v.appendChild(el("div", { class: "notice bad" }, [sla.waiting.length + " lead(s) have been waiting longer than " + sla.sla_minutes + " minutes. ", go]));
    }
    v.appendChild(card("By channel", el("pre", { text: JSON.stringify(s.by_channel) + "   messages sent: " + JSON.stringify(s.messages_sent) })));
    v.appendChild(card("Leads by status", el("pre", { text: JSON.stringify(s.leads_by_status) })));
  }

  async function viewAttention(v, slug) {
    var sla = await api("/admin/tenants/" + slug + "/sla");
    waitingCount = sla.waiting.length; renderTabs();
    if (!sla.sla_minutes) {
      var on = el("button", { text: "Turn on: alert after 15 minutes for hot leads" });
      on.addEventListener("click", async function () {
        try { await api("/admin/tenants/" + slug, { method: "PATCH", body: { sla_minutes: 15, sla_min_score: 70 } }); await loadTenants(slug); }
        catch (e) { fail(e); }
      });
      v.appendChild(card("Response alerts are off", el("div", {}, [
        el("p", { text: "When on, the owner gets one email if a promising lead has had no reply for the target time. Emails sent overnight wait until morning." }),
        el("p", { class: "mut", text: "Needs notify_email set under Setup." }), on
      ])));
      return;
    }
    v.appendChild(el("p", { class: "mut", text: "Leads scoring " + sla.sla_min_score + "+ still marked 'new' after " + sla.sla_minutes + " minutes, with no booking. Mark one contacted once you have replied." }));
    if (!sla.waiting.length) { v.appendChild(notice("good", "Nobody is waiting. Every promising lead has been picked up.")); return; }
    v.appendChild(card("Waiting for a reply", table(["Waiting", "Score", "Who", "Phone", "Email", "What they wanted", "Alert sent", ""], sla.waiting.map(function (w) {
      var btn = el("button", { text: "Mark contacted" });
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        try { await api("/admin/leads/" + w.id, { method: "PATCH", body: { status: "contacted" } }); render(); }
        catch (e) { btn.disabled = false; fail(e); }
      });
      return [waited(w.minutes_waiting), badge(w.score_label, w.score, w.reasons), w.name || "(no name)", w.phone, w.email, w.message, w.alerted ? "yes" : "not yet", btn];
    }))));
  }

  async function viewLeads(v, slug) {
    var minScore = leadFilter.minScore;
    var leads = await api("/admin/tenants/" + slug + "/leads?min_score=" + encodeURIComponent(minScore));
    if (leadFilter.sortScore) leads.sort(function (a, b) { return b.score - a.score; });
    var bar = el("div", { class: "row", style: "margin-bottom:10px" });
    var f = el("select", { id: "leadFilter" });
    [["0", "All leads"], ["40", "Warm and hot"], ["70", "Hot only"]].forEach(function (o) {
      var op = el("option", { value: o[0], text: o[1] }); if (o[0] === minScore) op.selected = true; f.appendChild(op);
    });
    f.addEventListener("change", function () { leadFilter.minScore = f.value; render(); });
    var sortCb = el("input", { type: "checkbox", id: "sortScore" }); sortCb.checked = leadFilter.sortScore;
    sortCb.addEventListener("change", function () { leadFilter.sortScore = sortCb.checked; render(); });
    bar.appendChild(f); bar.appendChild(el("label", { class: "row" }, [sortCb, "Highest score first"]));
    v.appendChild(bar);
    v.appendChild(card("Leads", table(["When", "Score", "Name", "Phone", "Email", "Message", "Via", "Status", "Value $", "Marketing consent"], leads.map(function (l) {
      var st = select(["new", "contacted", "booked", "won", "lost"], l.status, function (val) {
        moveLead(l.id, val).then(function (ok) { if (ok) refreshWaiting(); else render(); }).catch(fail);
      });
      var val = el("input", { type: "number", min: "0", value: String(l.value_cents / 100), style: "width:90px" });
      val.addEventListener("change", function () {
        api("/admin/leads/" + l.id, { method: "PATCH", body: { value_cents: Math.round(Number(val.value) * 100) } }).catch(fail);
      });
      var consent = el("div", {}, [el("span", { text: l.consent_marketing ? "Yes" : "No", class: l.consent_marketing ? "badge ok" : "mut" })]);
      if (l.consent_marketing && l.consent_marketing_basis) consent.firstChild.setAttribute("title", l.consent_marketing_basis);
      var rec = el("button", { class: "sec small", text: l.consent_marketing ? "Withdraw" : "Record consent" });
      rec.addEventListener("click", async function () {
        var granting = !l.consent_marketing;
        var basis = prompt(granting ? "Where did this person agree to receive promotions? (kept as the audit record)" : "Why is consent being withdrawn?");
        if (!basis || basis.trim().length < 5) return;
        try { await api("/admin/leads/" + l.id + "/marketing-consent", { method: "PATCH", body: { consent: granting, basis: basis.trim() } }); render(); }
        catch (e) { fail(e); }
      });
      consent.appendChild(rec);
      return [when(l.created_at), badge(l.score_label, l.score, reasonsOf(l)), l.name, l.phone, l.email, l.message, l.channel, st, val, consent];
    }))));
  }

  function previewPanel(slug, campaign, preview) {
    var box = el("div", { class: "card", id: "previewPanel" });
    box.appendChild(el("h2", { text: "Preview: " + campaign.name }));
    box.appendChild(el("p", {}, [el("b", { text: String(preview.recipients) }), " people would receive this " + campaign.channel + " campaign."]));
    var sk = preview.skipped || {};
    box.appendChild(el("p", { class: "mut small", text: "Left out: " + (sk.opted_out || 0) + " opted out, " + (sk.cooldown || 0) + " messaged recently, " + (sk.duplicate || 0) + " duplicates, " + (sk.over_cap || 0) + " over the cap." }));
    (preview.problems || []).forEach(function (p) { box.appendChild(notice("bad", p)); });
    if (preview.sample_message) box.appendChild(el("pre", { text: "Sample message:\n" + preview.sample_message }));
    if (preview.sample_recipients && preview.sample_recipients.length) {
      box.appendChild(table(["Name", "Contact", "Score"], preview.sample_recipients.map(function (s) { return [s.name, s.contact, s.score]; })));
    }
    var row = el("div", { class: "row", style: "margin-top:10px" });
    var send = el("button", { id: "sendCampaign", text: "Send to " + preview.recipients + " people" });
    send.disabled = !preview.ready || preview.recipients === 0 || campaign.status !== "draft";
    send.addEventListener("click", async function () {
      if (!confirm("Send this campaign to " + preview.recipients + " people? Messages go out gradually and you can cancel while they are pending.")) return;
      send.disabled = true;
      try {
        var r = await api("/admin/campaigns/" + campaign.id + "/send", { method: "POST", body: { expected_recipients: preview.recipients } });
        campaignPreview = null; alert("Queued " + r.queued + " messages."); render();
      } catch (e) { send.disabled = false; fail(e); }
    });
    var cancel = el("button", { class: "sec", text: "Cancel campaign" });
    cancel.addEventListener("click", async function () {
      if (!confirm("Cancel this campaign? Pending messages will not be sent.")) return;
      try { await api("/admin/campaigns/" + campaign.id + "/cancel", { method: "POST" }); campaignPreview = null; render(); } catch (e) { fail(e); }
    });
    var close = el("button", { class: "sec", text: "Close preview" });
    close.addEventListener("click", function () { campaignPreview = null; render(); });
    row.appendChild(send); if (campaign.status !== "cancelled") row.appendChild(cancel); row.appendChild(close);
    box.appendChild(row);
    if (campaign.status !== "draft") box.appendChild(el("p", { class: "mut small", text: "This campaign is " + campaign.status + ", so it cannot be sent again." }));
    return box;
  }

  async function viewCampaigns(v, slug) {
    var tenant = current;
    if (!tenant.campaigns_enabled) v.appendChild(notice("", "Campaigns are switched off for this client. You can draft and preview, but nothing can be sent until you turn them on under Setup."));
    v.appendChild(el("p", { class: "mut small", text: "Reactivation campaigns only reach leads with recorded marketing consent. Emails carry an unsubscribe link; texts end with 'Reply STOP to opt out.'" }));

    var form = el("div");
    function field(label, node) { return el("div", { class: "field" }, [el("label", { text: label }), node]); }
    var name = el("input", { id: "c_name", value: "Win-back", style: "flex:1;min-width:240px" });
    var channel = select(["email", "sms"], "email", function () {});
    channel.id = "c_channel";
    var subject = el("input", { id: "c_subject", value: "We miss you at {business}", style: "flex:1;min-width:240px" });
    var body = el("textarea", { id: "c_body", rows: "4", style: "flex:1;min-width:240px", text: "Hi {first}, it has been a while since we heard from you. Reply to this message if we can help." });
    var older = el("input", { id: "c_older", type: "number", min: "0", max: "3650", value: "30", style: "width:90px" });
    var minScore = el("input", { id: "c_minscore", type: "number", min: "0", max: "100", value: "0", style: "width:90px" });
    form.appendChild(field("Name", name)); form.appendChild(field("Channel", channel)); form.appendChild(field("Subject (email)", subject));
    form.appendChild(field("Message", body));
    form.appendChild(el("p", { class: "mut small", text: "Placeholders: {first} and {business}. Nothing else is allowed." }));
    form.appendChild(field("Lead is older than (days)", older)); form.appendChild(field("Minimum score", minScore));
    var create = el("button", { id: "createCampaign", text: "Create draft and preview" });
    create.addEventListener("click", async function () {
      create.disabled = true;
      try {
        var r = await api("/admin/tenants/" + slug + "/campaigns", { method: "POST", body: {
          name: name.value, channel: channel.value, subject: subject.value, body: body.value,
          older_than_days: Number(older.value || 0), min_score: Number(minScore.value || 0)
        } });
        campaignPreview = { campaign: r.campaign, preview: r.preview }; render();
      } catch (e) { create.disabled = false; fail(e); }
    });
    form.appendChild(el("div", { class: "row" }, [create]));
    v.appendChild(card("New campaign", form));

    if (campaignPreview) {
      // Never show a stale preview: settings or the audience may have changed since it was made.
      try {
        campaignPreview.campaign = await api("/admin/campaigns/" + campaignPreview.campaign.id);
        campaignPreview.preview = await api("/admin/campaigns/" + campaignPreview.campaign.id + "/preview");
        v.appendChild(previewPanel(slug, campaignPreview.campaign, campaignPreview.preview));
      } catch (e) { campaignPreview = null; }
    }

    var list = await api("/admin/tenants/" + slug + "/campaigns");
    v.appendChild(card("Campaigns", list.length ? table(["#", "Name", "Channel", "Status", "People", "Delivery", ""], list.map(function (c) {
      var open = el("button", { class: "sec small", text: "Open" });
      open.addEventListener("click", async function () {
        try { campaignPreview = { campaign: c, preview: await api("/admin/campaigns/" + c.id + "/preview") }; render(); } catch (e) { fail(e); }
      });
      return [c.id, c.name, c.channel, c.status, c.recipient_count, JSON.stringify(c.delivery || {}), open];
    })) : el("p", { class: "mut", text: "No campaigns yet." })));
  }

  function dealCard(l, stage) {
    var c = el("div", { class: "deal", "data-lead": l.id });
    c.appendChild(el("div", {}, [el("span", { class: "name", text: l.name || l.phone || l.email || "(no name)" }), badge(l.score_label, l.score)]));
    if (l.message) c.appendChild(el("div", { class: "mut small", text: l.message.length > 90 ? l.message.slice(0, 90) + "..." : l.message }));
    if (stage === "lost" && l.lost_reason) c.appendChild(el("div", { class: "small", text: "Lost: " + l.lost_reason }));
    var stageSel = select(["new", "contacted", "booked", "won", "lost"], stage, function (val) {
      moveLead(l.id, val).then(function () { render(); refreshWaiting(); }).catch(fail);
    });
    stageSel.className = "stageSel";
    c.appendChild(el("label", { text: "Stage" })); c.appendChild(stageSel);
    var value = el("input", { type: "number", min: "0", class: "dealValue", value: String(Math.round(l.effective_value_cents / 100)) });
    value.addEventListener("change", function () {
      api("/admin/leads/" + l.id, { method: "PATCH", body: { value_cents: Math.round(Number(value.value || 0) * 100) } }).then(render).catch(fail);
    });
    c.appendChild(el("label", { text: l.value_cents ? "Value ($)" : "Value ($, using the client average)" })); c.appendChild(value);
    if (stage !== "won" && stage !== "lost") {
      var next = el("input", { type: "datetime-local", class: "dealNext", value: localInputValue(l.next_action_at) });
      next.addEventListener("change", function () {
        if (!next.value) return;
        api("/admin/leads/" + l.id, { method: "PATCH", body: { next_action_at: new Date(next.value).toISOString() } }).then(refreshWaiting).catch(fail);
      });
      c.appendChild(el("label", { text: "Follow up on" })); c.appendChild(next);
    }
    return c;
  }

  async function viewPipeline(v, slug) {
    var pl = await api("/admin/tenants/" + slug + "/pipeline");
    var stat = function (l, val) { return el("div", { class: "card stat" }, [el("b", { text: String(val) }), el("span", { text: l })]); };
    v.appendChild(el("div", { class: "grid" }, [
      stat("Open pipeline", money(pl.open_value_cents)), stat("Weighted forecast", money(pl.weighted_value_cents)),
      stat("Won (last 30 days)", money(pl.won_value_cents))
    ]));
    var o = pl.odds;
    v.appendChild(el("p", { class: "mut small", text: "Each open stage is weighted by how often leads there tend to close: new " + Math.round(o.new * 100) + "%, contacted " + Math.round(o.contacted * 100) + "%, booked " + Math.round(o.booked * 100) + "%. Leads with no value of their own use the client's average lead value (" + money(pl.average_lead_value_cents) + ")." }));
    var board = el("div", { class: "board", id: "board" });
    ["new", "contacted", "booked", "won", "lost"].forEach(function (stage) {
      var col = pl.stages[stage];
      var box = el("div", { class: "col", id: "col_" + stage }, [el("h3", { text: stage + " (" + col.count + ")" }), el("div", { class: "mut small", text: money(col.value_cents) })]);
      col.leads.forEach(function (l) { box.appendChild(dealCard(l, stage)); });
      if (!col.leads.length) box.appendChild(el("p", { class: "mut small", text: "Nothing here." }));
      board.appendChild(box);
    });
    v.appendChild(board);
  }

  async function viewTodos(v, slug) {
    var form = el("div", { class: "row" });
    var title = el("input", { id: "t_title", placeholder: "What needs doing?", style: "flex:1;min-width:220px" });
    var due = el("input", { id: "t_due", type: "datetime-local" });
    var add = el("button", { id: "addTodo", text: "Add to-do" });
    add.addEventListener("click", async function () {
      if (!title.value.trim()) { title.focus(); return; }
      add.disabled = true;
      try {
        var body = { title: title.value.trim() };
        if (due.value) body.due_at = new Date(due.value).toISOString();
        await api("/admin/tenants/" + slug + "/tasks", { method: "POST", body: body });
        render(); refreshWaiting();
      } catch (e) { add.disabled = false; fail(e); }
    });
    title.addEventListener("keydown", function (e) { if (e.key === "Enter") add.click(); });
    form.appendChild(title); form.appendChild(due); form.appendChild(add);
    v.appendChild(card("New to-do", form));

    var showDone = el("input", { type: "checkbox", id: "showDone" }); showDone.checked = todoFilter.done;
    showDone.addEventListener("change", function () { todoFilter.done = showDone.checked; render(); });
    v.appendChild(el("label", { class: "row", style: "margin-bottom:8px" }, [showDone, "Show completed"]));

    var list = await api("/admin/tenants/" + slug + "/tasks?status=" + (todoFilter.done ? "all" : "open"));
    if (!list.length) { v.appendChild(card("", el("p", { class: "mut", text: "Nothing to do. New leads add a follow-up here automatically." }))); return; }
    var t = el("table", { id: "todoTable" });
    t.appendChild(el("tr", {}, ["", "To-do", "Due", "From", ""].map(function (h) { return el("th", { text: h }); })));
    list.forEach(function (x) {
      var done = x.status === "done";
      var cb = el("input", { type: "checkbox", class: "todoCheck", "aria-label": "Done" }); cb.checked = done;
      cb.addEventListener("change", async function () {
        try { await api("/admin/tasks/" + x.id, { method: "PATCH", body: { status: cb.checked ? "done" : "open" } }); render(); refreshWaiting(); } catch (e) { cb.checked = !cb.checked; fail(e); }
      });
      var overdue = !done && x.due_at && new Date(x.due_at) < new Date();
      var what = el("div", {}, [el("div", { text: x.title })]);
      if (x.notes) what.appendChild(el("div", { class: "mut small", text: x.notes.length > 120 ? x.notes.slice(0, 120) + "..." : x.notes }));
      var del = el("button", { class: "sec small", text: "Delete" });
      del.addEventListener("click", async function () {
        if (!confirm("Delete this to-do?")) return;
        try { await api("/admin/tasks/" + x.id, { method: "DELETE" }); render(); refreshWaiting(); } catch (e) { fail(e); }
      });
      var row = el("tr", { class: done ? "todo-done" : "" }, [
        el("td", {}, [cb]), el("td", {}, [what]),
        el("td", { class: overdue ? "overdue" : "" }, [x.due_at ? (overdue ? "Overdue: " : "") + when(x.due_at) : "-"]),
        el("td", {}, [el("span", { class: "src", text: x.source === "system" ? "automatic" : x.source })]),
        el("td", {}, [del])
      ]);
      t.appendChild(row);
    });
    v.appendChild(card("", t));
  }

  async function viewEmail(v, slug) {
    var base = "/admin/tenants/" + encodeURIComponent(slug) + "/email-drafts";
    v.appendChild(notice("good", "Drafts are private until you approve them. Generation never sends email."));
    var form = el("div");
    var sender = el("input", { type: "email", placeholder: "Sender email", style: "width:100%;margin-top:7px" });
    var subject = el("input", { placeholder: "Subject", style: "width:100%;margin-top:7px" });
    var inbound = el("textarea", { placeholder: "Paste incoming email", rows: "5", style: "width:100%;margin-top:7px" });
    var manual = el("textarea", { placeholder: "Optional: write your own draft reply", rows: "4", style: "width:100%;margin-top:7px" });
    var generate = el("button", { text: "Generate draft for approval" });
    var save = el("button", { text: "Save manual draft", class: "sec" });
    var status = el("div", { class: "mut small" });
    async function create(isGenerated) {
      status.textContent = "Working...";
      try {
        await api(base, { method: "POST", body: {
          sender: sender.value, subject: subject.value, inbound_body: inbound.value,
          reply_body: isGenerated ? null : manual.value, generate: isGenerated
        } });
        status.textContent = "Draft saved. It has not been sent.";
        await render();
      } catch (e) { status.textContent = e.message; }
    }
    generate.addEventListener("click", function () { create(true); });
    save.addEventListener("click", function () { create(false); });
    form.appendChild(sender);
    form.appendChild(subject);
    form.appendChild(inbound);
    form.appendChild(manual);
    form.appendChild(el("div", { class: "row" }, [generate, save, status]));
    v.appendChild(card("Prepare a reply", form));

    var drafts = await api(base + "?status=all");
    if (!drafts.length) {
      v.appendChild(card("Review queue", el("p", { class: "mut", text: "No email drafts yet." })));
      return;
    }
    drafts.forEach(function (d) {
      var box = el("div");
      box.appendChild(el("p", { text: "From: " + d.sender + " | " + when(d.created_at) }));
      box.appendChild(el("p", { text: "Subject: " + d.subject }));
      box.appendChild(el("pre", { text: d.inbound_body }));
      var reply = el("textarea", { rows: "7", style: "width:100%" });
      reply.value = d.reply_body;
      reply.disabled = d.status !== "draft";
      box.appendChild(reply);
      box.appendChild(el("p", { class: "mut", text: "Status: " + d.status }));
      if (d.status === "draft") {
        var saveEdit = el("button", { class: "sec", text: "Save changes" });
        var approve = el("button", { text: "Approve and queue email" });
        var discard = el("button", { class: "danger", text: "Discard" });
        var info = el("span", { class: "mut small" });
        async function perform(path, opts) {
          try {
            await api(base + "/" + d.id + path, opts);
            await render();
          } catch (e) { info.textContent = e.message; }
        }
        saveEdit.addEventListener("click", function () {
          perform("", { method: "PATCH", body: { reply_body: reply.value } });
        });
        approve.addEventListener("click", function () {
          if (!confirm("Queue this email for sending? This cannot be undone after dispatch.")) return;
          perform("/approve", { method: "POST" });
        });
        discard.addEventListener("click", function () {
          if (!confirm("Discard this draft?")) return;
          perform("/discard", { method: "POST" });
        });
        box.appendChild(el("div", { class: "row" }, [saveEdit, approve, discard, info]));
      }
      v.appendChild(card("Draft #" + d.id, box));
    });
  }

  async function viewSetup(v, slug) {
    var t = await api("/admin/tenants/" + slug);
    if (flash) { v.appendChild(notice("good", flash)); flash = ""; }
    v.appendChild(card("Embed snippet", el("pre", { text: t.embed_snippet })));
    v.appendChild(card("Links", table(["What", "URL"], [
      ["Demo (presenter)", t.demo_url], ["Client report (share with the client)", t.report_url],
      ["Twilio inbound-SMS webhook", t.sms_webhook_url], ["Calendar feed (subscribe in Google, Apple or Outlook Calendar; keep it private)", t.calendar_url || "-"], ["Knowledge chunks", t.chunk_count]
    ])));
    var keys = ["name", "persona", "greeting", "incentive", "booking_url", "lead_webhook_url", "notify_email", "review_url", "timezone", "sms_from", "lead_sms_template"];
    var form = el("div");
    keys.forEach(function (k) {
      form.appendChild(el("div", { class: "field" }, [el("label", { text: k }), el("input", { id: "f_" + k, value: t[k] || "", style: "flex:1;min-width:240px" })]));
    });
    var flags = ["native_booking", "sms_enabled", "voice_enabled", "campaigns_enabled", "weekly_digest"];
    flags.forEach(function (k) {
      var cb = el("input", { type: "checkbox", id: "f_" + k }); cb.checked = !!t[k];
      form.appendChild(el("div", { class: "field" }, [el("label", { text: k }), cb]));
    });
    form.appendChild(el("p", { class: "mut small", text: "campaigns_enabled lets this client send reactivation campaigns. Leave it off until the consent wording on your forms has been checked." }));
    form.appendChild(el("p", { class: "mut small", text: "weekly_digest emails notify_email a summary of the week every Monday morning (local time)." }));
    form.appendChild(el("div", { class: "field" }, [el("label", { text: "lead_value ($)" }), el("input", { id: "f_lead_value", type: "number", value: String((t.lead_value_cents || 0) / 100) })]));
    form.appendChild(el("div", { class: "field" }, [el("label", { text: "Alert if a lead waits (minutes, 0 = off)" }), el("input", { id: "f_sla_minutes", type: "number", min: "0", max: "1440", value: String(t.sla_minutes || 0), style: "width:90px" })]));
    form.appendChild(el("div", { class: "field" }, [el("label", { text: "...for leads scoring at least" }), el("input", { id: "f_sla_min_score", type: "number", min: "0", max: "100", value: String(t.sla_min_score == null ? 70 : t.sla_min_score), style: "width:90px" })]));
    form.appendChild(el("div", { class: "field" }, [el("label", { text: "business_hours" }), el("textarea", { id: "f_business_hours", rows: "6", style: "flex:1;min-width:240px;font-family:monospace", text: JSON.stringify(t.business_hours, null, 1) })]));
    var save = el("button", { id: "saveSettings", text: "Save settings" });
    var msg = el("span", { class: "mut", id: "saveMsg" });
    save.addEventListener("click", async function () {
      var body = {};
      keys.forEach(function (k) { var val = $("f_" + k).value; if (val !== (t[k] || "")) body[k] = val; });
      flags.forEach(function (k) { body[k] = $("f_" + k).checked; });
      body.lead_value_cents = Math.round(Number($("f_lead_value").value || 0) * 100);
      body.sla_minutes = Number($("f_sla_minutes").value || 0);
      body.sla_min_score = Number($("f_sla_min_score").value || 0);
      try { body.business_hours = JSON.parse($("f_business_hours").value); } catch (e) { msg.textContent = "business_hours is not valid JSON"; return; }
      try { await api("/admin/tenants/" + slug, { method: "PATCH", body: body }); flash = "Settings saved."; await loadTenants(slug); }
      catch (e) { msg.textContent = "Error: " + e.message; }
    });
    form.appendChild(el("div", { class: "row" }, [save, msg]));
    v.appendChild(card("Settings", form));

    // ---- lead scoring weights
    var sc = await api("/admin/tenants/" + slug + "/scoring");
    var inputs = {};
    var scBox = el("div");
    scBox.appendChild(el("p", { class: "mut small", text: "Every point has a stated reason and the same lead always scores the same. Change a number to tune what counts as a good lead for this client, then re-score." }));
    scBox.appendChild(table(["Rule", "Default", "This client"], sc.weights.map(function (w) {
      var inp = el("input", { type: "number", id: "w_" + w.key, value: String(w.value), style: "width:90px" });
      inputs[w.key] = { node: inp, def: w.default };
      return [w.label, String(w.default), inp];
    })));
    var scSave = el("button", { id: "saveScoring", text: "Save scoring" });
    var scReset = el("button", { class: "sec", id: "resetScoring", text: "Reset to defaults" });
    var scRe = el("button", { class: "sec", id: "rescoreLeads", text: "Re-score all leads" });
    var scMsg = el("span", { class: "mut", id: "scoringMsg" });
    scSave.addEventListener("click", async function () {
      var overrides = {};
      Object.keys(inputs).forEach(function (k) { var n = Number(inputs[k].node.value); if (n !== inputs[k].def) overrides[k] = n; });
      try { await api("/admin/tenants/" + slug, { method: "PATCH", body: { scoring: overrides } }); scMsg.textContent = "Saved. Existing leads keep their old score until you re-score."; }
      catch (e) { scMsg.textContent = "Error: " + e.message; }
    });
    scReset.addEventListener("click", async function () {
      try { await api("/admin/tenants/" + slug, { method: "PATCH", body: { scoring: {} } }); render(); } catch (e) { fail(e); }
    });
    scRe.addEventListener("click", async function () {
      scRe.disabled = true;
      try { var r = await api("/admin/tenants/" + slug + "/rescore", { method: "POST" }); scMsg.textContent = "Re-scored " + r.rescored + " leads: " + r.hot + " hot, " + r.warm + " warm, " + r.cold + " cold."; }
      catch (e) { scMsg.textContent = "Error: " + e.message; }
      scRe.disabled = false;
    });
    scBox.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [scSave, scReset, scRe, scMsg]));
    v.appendChild(card("Lead scoring", scBox));
  }

  async function render() {
    var v = $("view"); v.textContent = "";
    if (!current) { v.appendChild(card("", el("p", { text: "No customers yet. Choose Add customer to create a separate workspace and invite its owner." }))); return; }
    var slug = current.slug, days = $("days").value;
    try {
      if (tab === "overview") await viewOverview(v, slug, days);
      else if (tab === "attention") await viewAttention(v, slug);
      else if (tab === "pipeline") await viewPipeline(v, slug);
      else if (tab === "leads") await viewLeads(v, slug);
      else if (tab === "to-dos") await viewTodos(v, slug);
      else if (tab === "email") await viewEmail(v, slug);
      else if (tab === "campaigns") await viewCampaigns(v, slug);
      else if (tab === "appointments") {
        var ap = await api("/admin/tenants/" + slug + "/appointments");
        v.appendChild(card("Appointments", table(["Starts", "Name", "Phone", "Email", "Notes", "Status"], ap.map(function (a) {
          var st = select(["booked", "completed", "cancelled", "no_show"], a.status, function (val) {
            api("/admin/appointments/" + a.id, { method: "PATCH", body: { status: val } }).then(refreshWaiting).catch(fail);
          });
          return [when(a.starts_at), a.name, a.phone, a.email, a.notes, st];
        }))));
      } else if (tab === "conversations") {
        var convs = await api("/admin/tenants/" + slug + "/conversations");
        convs.forEach(function (c) {
          var box = el("div", {}, c.messages.map(function (m) {
            return el("div", { class: "bubble " + m.role + (m.flag ? " flag" : ""), text: m.content + (m.flag ? "   [" + m.flag + "]" : "") });
          }));
          v.appendChild(card(c.channel + " - " + when(c.started_at) + (c.page_url ? " - " + c.page_url : ""), box));
        });
        if (!convs.length) v.appendChild(card("", el("p", { text: "No conversations yet." })));
      } else if (tab === "outbox") {
        var ob = await api("/admin/tenants/" + slug + "/outbox");
        v.appendChild(card("Follow-up messages", table(["#", "Kind", "Channel", "To", "Status", "Tries", "Error", "Send at"], ob.map(function (o) {
          return [o.id, o.kind, o.channel, o.to_addr, o.status, o.attempts, o.last_error, when(o.send_at)];
        }))));
      } else if (tab === "setup") await viewSetup(v, slug);
    } catch (e) {
      if (e.message === "auth") return logout();
      v.appendChild(card("Error", el("pre", { text: e.message })));
    }
  }

  async function loadTenants(keep) {
    tenants = await api("/admin/tenants");
    var sel = $("tenant"); sel.textContent = "";
    tenants.forEach(function (t) { sel.appendChild(el("option", { value: t.slug, text: t.name })); });
    current = tenants.find(function (t) { return t.slug === keep; }) || tenants[0] || null;
    if (current) sel.value = current.slug;
    renderTabs(); render(); refreshWaiting();
  }

  function logout() { try { sessionStorage.removeItem("cc_admin"); } catch (e) {} token = "";pendingCustomer=null;customerSaving=false; $("app").hidden = true; $("login").hidden = false;
    $("new-customer-form").reset();$("new-customer-name").disabled=false;$("new-customer-site").disabled=false;$("create-customer").disabled=false;$("create-customer").textContent="Create workspace and invitation";$("new-customer-result").textContent="";$("new-customer-status").textContent="";$("new-customer-panel").hidden=true;
  }

  async function start() {
    try { var caps = await api("/admin/capabilities"); emailFeature = !!caps.email_drafts; if (emailFeature && TABS.indexOf("email") < 0) TABS.splice(TABS.indexOf("outbox"), 0, "email"); await loadTenants(); $("login").hidden = true; $("app").hidden = false; try { sessionStorage.setItem("cc_admin", token); } catch (e) {} }
    catch (e) { $("loginErr").textContent = e.message === "auth" ? "Wrong token." : e.message; }
  }

  $("new-customer").addEventListener("click",function(){ $("new-customer-panel").hidden=false;$("new-customer-name").focus(); });
  $("new-customer-form").addEventListener("submit",async function(event){
    event.preventDefault();if(customerSaving)return;customerSaving=true;
    var button=$("create-customer"),status=$("new-customer-status");button.disabled=true;
    try{
      if(!pendingCustomer){
        var name=$("new-customer-name").value.trim(),site=$("new-customer-site").value.trim();
        if(!name)throw new Error("Enter the business name.");
        if(site){var url=new URL(site);if(url.protocol!=="https:"||url.username||url.password)throw new Error("Use the customer's HTTPS website address.");}
        pendingCustomer=await api("/admin/tenants",{method:"POST",body:{name:name,site_url:site||null}});
      }
      // If invitation delivery preparation fails, retry for this workspace;
      // do not create duplicate businesses on the next click.
      $("new-customer-name").disabled=true;$("new-customer-site").disabled=true;
      status.textContent="Workspace created. Preparing the owner's private invitation…";
      var result=await api("/admin/tenants/"+encodeURIComponent(pendingCustomer.slug)+"/owner-invitations",{
        method:"POST",body:{email:$("new-customer-email").value.trim(),role:"owner"}});
      var host=$("new-customer-result");host.textContent="";
      host.appendChild(el("p",{text:pendingCustomer.name+": share this link privately with the owner. It expires in 24 hours."}));
      var link=el("textarea",{"aria-label":"Private customer invitation link",rows:"3",readonly:""});link.value=result.invitation_url;host.appendChild(link);
      status.textContent="Customer workspace and invitation are ready. The owner can set a password, add business information and connect their own social accounts.";
      var slug=pendingCustomer.slug;pendingCustomer=null;$("new-customer-form").reset();
      $("new-customer-name").disabled=false;$("new-customer-site").disabled=false;
      button.textContent="Create workspace and invitation";await loadTenants(slug);
    }catch(error){
      status.textContent=error.message;button.textContent=pendingCustomer?"Retry invitation for this workspace":"Create workspace and invitation";
    }finally{customerSaving=false;button.disabled=false;}
  });

  $("go").addEventListener("click", function () { token = $("token").value.trim(); start(); });
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  $("refresh").addEventListener("click", function () { refreshWaiting(); render(); });
  $("days").addEventListener("change", render);
  $("logout").addEventListener("click", logout);
  $("tenant").addEventListener("change", function () {
    current = tenants.find(function (t) { return t.slug === $("tenant").value; }); campaignPreview = null; renderTabs(); render(); refreshWaiting();
  });
  try { var saved = sessionStorage.getItem("cc_admin"); if (saved) { token = saved; start(); } } catch (e) {}
})();
</script>
