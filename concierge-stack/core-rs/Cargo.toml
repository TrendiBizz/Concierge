[package]
name = "concierge-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust ports of Concierge's pure business logic, held to byte-for-byte parity with the Python originals."

[dependencies]
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
url = "2"
serde = { version = "1", features = ["derive"] }
pbkdf2 = "0.12"
fancy-regex = "0.14"

[dev-dependencies]


# Dependencies (PBKDF2, SHA-2, regex) run optimised even in dev/test builds; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
