[package]
name = "concierge-social"
version = "0.1.0"
edition = "2021"
publish = false
description = "Small service that links customers' social accounts and publishes approved posts for Concierge."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
