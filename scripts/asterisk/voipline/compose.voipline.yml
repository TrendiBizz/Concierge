# VoipLine override: attach the PBX to an egress network and publish SIP/RTP.
# Apply only after verification and with firewall rules limited to VoipLine.
services:
  pbx:
    networks: [phone, voipline]
    ports:
      - "5060:5060/udp"
      - "10000-10099:10000-10099/udp"

networks:
  voipline: {}
