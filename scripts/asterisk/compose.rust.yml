# Override that swaps ONLY the `bridge` service from the Python bridge to the Rust shell.
# Python stays the default and the rollback:
#   Rust:     docker compose -f compose.yml -f compose.rust.yml up -d --build bridge
#   Rollback: docker compose -f compose.yml up -d --force-recreate bridge
#
# Prerequisites (see README "Rust telephone shell"):
#   - INTERNAL_TOKEN set in the private API env file (the same value is passed here as CONCIERGE_INTERNAL_TOKEN)
#   - the API image running a version that includes api/app/voice_internal.py
#   - XAI_API_KEY available to this service
# Run only one bridge per route port. Never run the Python and Rust bridges together.
services:
  bridge:
    build:
      context: ../../concierge-stack/core-rs
      dockerfile: Dockerfile.shell
    image: concierge-asterisk-shell:local
    command: !reset []
    entrypoint: ["/usr/local/bin/asterisk_shell"]
    volumes: !reset []
    env_file: !reset []
    restart: unless-stopped
    environment:
      ASTERISK_BIND: 0.0.0.0
      ASTERISK_PEERS: 172.30.91.2/32
      ASTERISK_ROUTES: ${ASTERISK_ROUTES:?Supply explicit provisioned business routes}
      CONCIERGE_INTERNAL_URL: ${CONCIERGE_INTERNAL_URL:-http://api:8000}
      CONCIERGE_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN (same value as the API)}
      XAI_API_KEY: ${XAI_API_KEY:?Set XAI_API_KEY}
      XAI_REALTIME_URL: ${XAI_REALTIME_URL:-wss://api.x.ai/v1/realtime}
    networks: [phone, concierge]
