name: trendi
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/postgres.env, format: raw}
    # Tuned 2026-11-15 for THIS box: 2 vCPU / 8 GiB shared with the API, the website, Asterisk,
    # Chatwoot and Twenty. Method taken from arjaythedev/multicore-server-challenge (its box/pg-conf.sh
    # is pgtune's "web" profile for 8 threads and 100 connections) - but that profile assumes Postgres
    # owns the machine and gives it RAM/4 = 2 GB of shared_buffers. Here it shares the box, and the
    # database is ~20 MB, so the memory values are deliberately capped and only the two settings that
    # change planner and observability behaviour are taken at full strength:
    #   random_page_cost 4 -> 1.1        (storage is SSD; 4 makes the planner over-prefer seq scans)
    #   effective_io_concurrency 1 -> 200 (same reason: no seek penalty to model)
    #   shared_preload_libraries=pg_stat_statements (we had no way to see per-query cost at all)
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=2000
      - -c
      - pg_stat_statements.track=all
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d concierge"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  # media-render was retired on 2026-11-14: the product no longer generates images or video, so
  # there is nothing for it to render. Customers upload their own media.
  # DKIM/DMARC sidecar. The api reaches it at EMAIL_AUTH_URL (http://email-auth:8090).
  # This service ran on the VPS but was missing from this file, so a plain
  # `compose up` would have treated it as an orphan and removed it, breaking
  # inbound verification. Keep it declared here.
  email-auth:
    build:
      context: ../../services/email-auth
    image: trendi-email-auth:vps
    restart: unless-stopped
    expose: ["8090"]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8090/healthz]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: scripts/vps/Dockerfile.api
    image: trendi-concierge-api:vps
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/api.env, format: raw}
    volumes: [api-model-cache:/opt/fastembed, /opt/trendi/shared/calendar:/run/concierge-calendar, /opt/trendi/shared/designs:/data/designs, /opt/trendi/shared/media:/data/media, /opt/trendi/shared/studio:/srv/studio:ro, /opt/trendi/backups:/backups:ro]
    ports: [127.0.0.1:8000:8000]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1200m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
  social:
    build:
      context: ../..
      dockerfile: scripts/vps/Dockerfile.social
    image: trendi-concierge-social:vps
    network_mode: service:api
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/social.env, format: raw}
    environment:
      SOCIAL_MEDIA_DIR: /data/media
      SOCIAL_PUBLIC_MEDIA_BASE: https://concierge.trendibizz.com/api/v1/social-media
      SOCIAL_DB: /data/social.db
      SOCIAL_BIND: 127.0.0.1:4390
      SOCIAL_ENABLE_PUBLISH: "false"
    volumes: [social:/data]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
  website:
    image: node:22-alpine
    restart: unless-stopped
    command: [node, /srv/website.mjs]
    env_file:
      - {path: /opt/trendi/shared/website.env, format: raw}
    environment: {NODE_OPTIONS: --max-old-space-size=96}
    volumes:
      - ./website.mjs:/srv/website.mjs:ro
      - ${TRENDI_WEBSITE}:/website:ro
    mem_limit: 160m
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports: [127.0.0.1:8080:8080]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on:
      api: {condition: service_healthy}
      website: {condition: service_started}
    mem_limit: 96m
  crm-db:
    profiles: [crm]
    image: postgres:16
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/crm-db.env, format: raw}
    volumes: [crm-database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
  crm-redis:
    profiles: [crm]
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [crm-redis:/data]
    command: [redis-server, --appendonly, "no", --save, "60", "1"]
    mem_limit: 192m
  crm:
    profiles: [crm]
    image: ${TWENTY_IMAGE:?Use the verified current multi-architecture image digest}
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/crm.env, format: raw}
    volumes: [crm-storage:/app/packages/twenty-server/.local-storage]
    depends_on:
      crm-db: {condition: service_healthy}
      crm-redis: {condition: service_started}
    mem_limit: 1536m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  crm-worker:
    profiles: [crm]
    image: ${TWENTY_IMAGE:?Use the verified current multi-architecture image digest}
    restart: unless-stopped
    command: [yarn, worker:prod]
    env_file:
      - {path: /opt/trendi/shared/crm.env, format: raw}
    environment:
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes: [crm-storage:/app/packages/twenty-server/.local-storage]
    depends_on:
      crm: {condition: service_started}
    mem_limit: 1536m
  public-main:
    profiles: [public]
    image: cloudflare/cloudflared:latest
    user: "0:0"
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - /opt/trendi/shared/tunnel-main.yml:/etc/cloudflared/config.yml:ro
      - /opt/trendi/shared/tunnel-main.json:/etc/cloudflared/credentials.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [gateway]
    mem_limit: 128m
  public-owner:
    profiles: [public]
    image: cloudflare/cloudflared:latest
    user: "0:0"
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - /opt/trendi/shared/tunnel-owner.yml:/etc/cloudflared/config.yml:ro
      - /opt/trendi/shared/tunnel-owner.json:/etc/cloudflared/credentials.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [gateway]
    mem_limit: 128m
  # ── Services that already ran on the VPS but were never declared here ──────
  # They carry `com.docker.compose.project=trendi` labels, so ANY
  # `compose up --remove-orphans` deletes them: the mail filter, the spam
  # scanner, and the phone receptionist shell. Declared so that command is safe.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
    mem_limit: 1800m
    cpus: 1
  rspamd:
    image: rspamd/rspamd:latest
    command: [/usr/bin/rspamd, -f]
    restart: unless-stopped
    environment:
      RSPAMD_LOCAL_ADDR: '*'
      RSPAMD_LOG_TYPE: console
    volumes: [rspamd-data:/var/lib/rspamd]
    mem_limit: 512m
    cpus: 1
  # Rust AudioSocket shell (concierge-stack/core-rs/Dockerfile.shell). It joins
  # the Asterisk phone network as well as the app network, exactly as the live
  # container does; a recreate that dropped `asterisk_phone` would leave the PBX
  # with nothing to send call audio to.
  shell:
    image: trendi-asterisk-shell:vps
    entrypoint: [asterisk_shell]
    restart: unless-stopped
    env_file:
      - {path: /opt/trendi/shared/api.env, format: raw}
    environment:
      ASTERISK_BIND: 0.0.0.0
      ASTERISK_PEERS: ${ASTERISK_PEERS:-172.30.91.2/32}
      # Server-specific: lives in /opt/trendi/shared/compose.env, never in the
      # repo. The shell panics on an empty list, so it must be set there.
      ASTERISK_ROUTES: ${ASTERISK_ROUTES:-}
      CONCIERGE_INTERNAL_URL: http://api:8000
    networks: [default, asterisk_phone]
    mem_limit: 256m
    cpus: 1
volumes:
  database:
  api-model-cache:
  social:
  crm-database:
  crm-redis:
  crm-storage:
  rspamd-data:

networks:
  # Created by scripts/asterisk/compose.yml (project "asterisk"). External so a
  # compose run in this project never recreates or deletes it.
  asterisk_phone:
    external: true
