[Service]
# The stock podman-restart.service restarts only restart-policy=always, but every compose service in
# this repo uses `restart: unless-stopped`, so nothing would come back after a reboot. Start
# unless-stopped containers instead. Install at /etc/systemd/system/podman-restart.service.d/unless-stopped.conf
# then `systemctl daemon-reload` (found 2026-11-17 during the Docker -> Podman move).
ExecStart=
ExecStart=/usr/bin/podman --log-level=info start --all --filter restart-policy=unless-stopped
ExecStop=
ExecStop=/bin/sh -c "/usr/bin/podman --log-level=info stop $(/usr/bin/podman container ls --filter restart-policy=unless-stopped -q)"
