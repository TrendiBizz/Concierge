map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ /\. { return 404; }
    location = /_headers { return 404; }
    location = /_redirects { return 404; }
    location = /concierge/sign-in { return 302 /owner-ui; }
    location = /tools/security-check { return 302 /security-check; }
    location ~ ^/api/(robots|site-check|security-check)$ {
        proxy_pass http://tools:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(admin-ui$|owner-ui$|healthz$|widget\.js$|admin/|owner/|api/v1/|demo/|report/) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'https://trendibizz.com' 'http://127.0.0.1:8793';
    }
    location / {
        __MARKETING_HEADERS__
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/index.html =404;
        sub_filter_once off;
        sub_filter 'https://chat.trendibizz.com/widget.js' '/widget.js';
        sub_filter 'data-key="pk_8y_wsHO4StqCzd0yc2QNEKp0"' 'data-key="__WIDGET_KEY__"';
    }
}
