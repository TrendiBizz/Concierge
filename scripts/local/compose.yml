name: trendi-local
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: ../../.private/local-stack/postgres.env
    volumes:
      - database:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d trendi_local"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: concierge-api:trendi-local
    build:
      context: ../../api
      dockerfile: Dockerfile.integration
    restart: unless-stopped
    env_file: ../../.private/local-stack/api.env
    volumes:
      - ${TRENDI_WEBSITE}/site:/preview-site:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 1200m
    cpus: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  tools:
    image: node:22-alpine
    restart: unless-stopped
    command: [node, /srv/server.mjs]
    volumes:
      - ./tools.mjs:/srv/server.mjs:ro
      - ${TRENDI_WEBSITE}/deploy_known_good/_worker.js:/srv/worker.mjs:ro
    mem_limit: 128m
    cpus: 0.25
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8793:80
    volumes:
      - ${TRENDI_WEBSITE}/site:/usr/share/nginx/html:ro
      - ../../.private/local-stack/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy
      tools:
        condition: service_started
volumes:
  database:
